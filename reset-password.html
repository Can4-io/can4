<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | CAN42</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="reset">
<div id="site-header"></div>
<main id="main" class="auth-wrap">
  <aside class="auth-side"><h2>New password</h2><p>Choose a strong password you do not use anywhere else.</p></aside>
  <section class="auth-main">
    <div class="card auth-card">
      <h1>Choose a new password</h1>
      <form id="reset-form" novalidate>
        <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" data-pw autocomplete="new-password" required><small>At least 8 characters, with a letter and a number.</small></div>
        <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" data-pw autocomplete="new-password" required></div>
        <label class="check"><input type="checkbox" data-show-password> Show passwords</label>
        <div class="form-msg" role="alert" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit">Save new password</button>
      </form>
      <div id="reset-invalid" hidden>
        <p class="form-msg is-error">This reset link is invalid or has expired.</p>
        <a class="btn btn-primary btn-block" href="forgot-password.html">Request a new link</a>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
