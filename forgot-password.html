<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | CAN42</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-page="forgot">
<div id="site-header"></div>
<main id="main" class="auth-wrap">
  <aside class="auth-side"><h2>Reset your password</h2><p>Enter your email and we will send a link to choose a new password.</p></aside>
  <section class="auth-main">
    <div class="card auth-card">
      <h1>Forgot password</h1>
      <p class="lead">We will email you a reset link.</p>
      <form id="forgot-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
        <div class="form-msg" role="alert" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <div class="auth-links"><a href="login.html">Back to log in</a></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
